<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="fonts.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; background: transparent; user-select: none; overflow: hidden; }
    .card {
      width: 360px; height: 208px; margin: 6px;
      background: #12161d; border: 1px solid #232a35; border-radius: 18px;
      padding: 14px 16px; display: flex; flex-direction: column; gap: 9px;
      color: #e8edf4; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
      -webkit-app-region: drag;
    }
    .no-drag { -webkit-app-region: no-drag; }
    .top { display: flex; align-items: center; gap: 8px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #339dff; }
    .tag { font-size: 10px; font-weight: 800; color: #339dff; letter-spacing: 1px; flex-grow: 1; }
    .prog-txt { font-size: 11px; font-weight: 700; color: #5a6676; }
    .segs { display: flex; gap: 3px; }
    .seg { width: 10px; height: 5px; border-radius: 3px; background: #232a35; }
    .seg.done { background: #2fd39c; }
    .seg.now { background: #339dff; }
    .title { font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { font-size: 11px; font-weight: 600; color: #8b98a9; }
    .mid { display: flex; align-items: center; gap: 12px; flex-grow: 1; }
    .timer { font-size: 32px; font-weight: 800; letter-spacing: 0.5px; font-variant-numeric: tabular-nums; }
    .hint { font-size: 11px; font-weight: 600; color: #5a6676; line-height: 1.35; }
    .btns { display: flex; gap: 8px; }
    .btn-main {
      flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
      background: #339dff; border-radius: 11px; padding: 10px;
      font-size: 13px; font-weight: 800; color: #fff; cursor: pointer;
    }
    .btn-sq {
      width: 40px; display: flex; align-items: center; justify-content: center;
      background: #171c24; border: 1px solid #232a35; border-radius: 11px;
      cursor: pointer; color: #8b98a9; font-size: 13px; font-weight: 800;
    }
    .btn-main:hover { filter: brightness(1.1); }
    .btn-sq:hover { color: #e8edf4; }
    .vazio { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; gap: 4px; color: #5a6676; font-size: 12px; font-weight: 700; }
  </style>
</head>
<body>
<div class="card" id="card"></div>
<script src="widget.js"></script>
</body>
</html>
